name: Release

# Запускается при пуше тега вида v1.0.0, v2.3.1 и т.д.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # нужно, чтобы workflow мог создавать релизы

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
            archive_ext: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: osx-x64
            os: ubuntu-latest
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Release --no-restore

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/CoK.OsmImporter.Cli
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/${{ matrix.rid }}

      - name: Package (zip, Windows)
        if: matrix.archive_ext == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../cok-osm-importer-${{ matrix.rid }}.zip .

      - name: Package (tar.gz, Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../cok-osm-importer-${{ matrix.rid }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cok-osm-importer-${{ matrix.rid }}
          path: cok-osm-importer-${{ matrix.rid }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false